name: CI
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  crystal-style:
    name: Crystal Style
    uses: PlaceOS/.github/.github/workflows/crystal-style.yml@main

  test:
    name: "${{ !matrix.stable && '🚧 ' || '' }}crystal: ${{ matrix.crystal }}, MT: ${{ matrix.MT && '☑' || '☐' }}"
    strategy:
      fail-fast: false
      matrix:
        MT: [true, false]
        stable: [true]
        crystal:
          - latest
        include:
          - crystal: nightly
            MT: true
            stable: false
          - crystal: nightly
            MT: false
            stable: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Test ${{ matrix.MT && 'Multithreaded' || '' }}
        run: |
          crystal spec \
          --error-trace \
          ${{ matrix.MT && '-Dpreview_mt' || '' }} \
          --order random \
          --verbose

  compiled-router:
    name: Compiled LuckyRouter (MT=${{ matrix.MT }})
    strategy:
      fail-fast: false
      matrix:
        MT: [true, false]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Select LuckyRouter with compiled snapshots
        run: |
          cat > shard.override.yml <<'EOF'
          dependencies:
            lucky_router:
              github: stakach/lucky_router
              commit: 78cbfda312ec638ed6e180b7842080d8bf37621a
          EOF
      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Test compiled routing
        run: crystal spec --error-trace --order random ${{ matrix.MT && '-Dpreview_mt' || '' }}
