name: CI
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  crystal-style:
    name: Crystal Style
    uses: PlaceOS/.github/.github/workflows/crystal-style.yml@main

  test:
    name: "${{ !matrix.stable && '🚧 ' || '' }}crystal: ${{ matrix.crystal }}"
    strategy:
      fail-fast: false
      matrix:
        stable: [true]
        crystal:
          - latest
        include:
          - crystal: nightly
            stable: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Test
        run: |
          crystal spec \
          --error-trace \
          --order random \
          --verbose
