name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  crystal-style:
    name: Crystal Style
    if: github.event_name != 'pull_request'
    uses: PlaceOS/.github/.github/workflows/crystal-style.yml@main

  # a fork's pull request gets a read only token, so the ameba action can't
  # report through the checks API: run format and ameba directly instead
  pull-request-style:
    name: Crystal Style
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: crystal tool format --check
      - name: Install ameba
        run: shards install --ignore-crystal-version
      - name: Lint
        run: ./bin/ameba

  test:
    name: "${{ !matrix.stable && '🚧 ' || '' }}crystal: ${{ matrix.crystal }}"
    strategy:
      fail-fast: false
      matrix:
        stable: [true]
        crystal:
          - latest
        include:
          - crystal: nightly
            stable: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Test
        run: |
          crystal spec \
          --error-trace \
          --order random \
          --verbose
