name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  # runs the shard's own ameba: the ameba action reports through the checks
  # API, which a fork's pull request (a read only token) can't write to
  crystal-style:
    name: Crystal Style
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: crystal tool format --check
      - name: Install dependencies
        run: shards install --ignore-crystal-version
      - name: Build ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba --no-debug
      - name: Lint
        run: ./bin/ameba

  test:
    name: "${{ !matrix.stable && '🚧 ' || '' }}crystal: ${{ matrix.crystal }}"
    strategy:
      fail-fast: false
      matrix:
        stable: [true]
        crystal:
          - latest
        include:
          - crystal: nightly
            stable: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Test
        run: |
          crystal spec \
          --error-trace \
          --order random \
          --verbose
